[package]
name = "mod-moderndynamics"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-only"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# The pinned SDK's copy, which `cargo horizon-mod` fetches into .horizon/sdk/. In a checkout,
# `ports/atm10/dev-sdk.sh` links it to this repository's crates for `cargo check`.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }

