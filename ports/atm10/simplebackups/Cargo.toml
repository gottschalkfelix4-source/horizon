[package]
name = "mod-simplebackups"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# In a launcher build this is the pinned SDK's copy (.horizon/sdk/api/crates/horizon-mod-api);
# in this checkout it is the workspace crate, so `cargo check` runs against the current API.
horizon-mod-api = { path = "../../../crates/horizon-mod-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[workspace]
