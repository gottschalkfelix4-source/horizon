# The libraries ATM10's mods share, as crates built on Horizon's mod API. A ported mod depends on
# the one it needs by path (`../libs/config`); none of them is a mod of its own.
[workspace]
resolver = "3"
members = ["config", "geo", "guidebook", "accessories"]

[workspace.package]
edition = "2024"
license = "LGPL-3.0-or-later"
publish = false

[workspace.dependencies]
# In a launcher build this is the pinned SDK's copy (.horizon/sdk/api/crates/horizon-mod-api);
# in this checkout it is the workspace crate, so `cargo check` runs against the current API.
horizon-mod-api = { path = "../../../crates/horizon-mod-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
